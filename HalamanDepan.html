<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deployment ED SBU</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #eef0f3;
    --card: #ffffff;
    --border: #e4e7ec;
    --text: #1a1d23;
    --text-dim: #7a8290;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  .page-header { padding: 6px 4px 16px; }
  .page-header h1 { font-size: 20px; margin: 0 0 2px; }
  .page-header p { font-size: 13px; color: var(--text-dim); margin: 0; }

  .kategori-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .kategori-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 10px;
    text-align: center;
    cursor: pointer;
  }
  .kategori-card:active { background: #f5f6f8; }
  .kategori-card .icon { font-size: 30px; margin-bottom: 10px; }
  .kategori-card .label { font-weight: 700; font-size: 14px; }
  .kategori-card .desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
</style>
</head>
<body>

  <div class="page-header">
    <h1>📡 Deployment ED SBU</h1>
    <p>Pilih mode</p>
  </div>

  <div class="kategori-grid">
    <div class="kategori-card" onclick="window.location.href='cekprogress.html'">
      <div class="icon">👁️</div>
      <div class="label">Cek Progress JT</div>
      <div class="desc">Lihat status terkini</div>
    </div>
    <div class="kategori-card" onclick="window.location.href='updateprogress.html'">
      <div class="icon">✏️</div>
      <div class="label">Input Progress</div>
      <div class="desc">Catat update lapangan</div>
    </div>
  </div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
</script>
</body>
</html>
